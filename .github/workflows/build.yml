name: Convert to JAR (With Fallback)

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Smart Build JAR (Zip or Raw Files)
        run: |
          # 1. Check kung existing ang zip file
          if [ -f "asocietyclient.zip" ]; then
            echo "✅ ZIP file found! Extracting and converting..."
            mkdir -p extracted_folder
            unzip asocietyclient.zip -d extracted_folder
            cd extracted_folder
            jar cf ../asocietyclient.jar *
            cd ..
          
          # 2. Kung walang zip, hanapin ang java/class files sa repo
          else
            echo "⚠️ ZIP file NOT found. Looking for raw Java files..."
            
            # Kung may .java files, i-compile muna
            if ls *.java 1> /dev/null 2>&1; then
              echo "Compiling .java files..."
              javac *.java
            fi
            
            # Gawin ang JAR file mula sa mga classes o kung anong meron sa root
            echo "Creating JAR from available files..."
            jar cf asocietyclient.jar *.class *.java 2>/dev/null || jar cf asocietyclient.jar *
          fi

      - name: Upload JAR file
        uses: actions/upload-artifact@v4
        with:
          name: converted-jar
          path: asocietyclient.jar
          if-no-files-found: error
